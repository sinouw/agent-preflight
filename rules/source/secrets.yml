# Access to credentials and private configuration.
rules:
  - id: PF-SRC-001
    title: Access to credentials or sensitive local files
    severity: high
    layer: source
    scope: [source, hook-command, package-script, mcp-config]
    description: >-
      The code or command references SSH keys, cloud credentials, .env files, browser
      profiles and cookie stores, the OS keychain, package-manager tokens, or other agents'
      configuration (~/.claude, ~/.cursor, claude_desktop_config.json). An MCP server or hook
      rarely needs any of these.
    remediation: >-
      Confirm why the code touches this path. If it is not essential to the tool's stated
      purpose, do not install.
    message: 'References sensitive path or store: "{match}"'
    tags: [credentials]
    match:
      type: regex
      patterns:
        - '[''"`/~]\.ssh(/|\b)'
        - '\bid_(rsa|ed25519|ecdsa|dsa)\b'
        - '\.aws/(credentials|config)\b'
        - '[''"`/]\.env(\.[\w-]+)?[''"`]'
        - '\.(npmrc|netrc|pypirc|git-credentials)\b'
        - '\.kube/config\b|\.docker/config\.json\b|[''"`/~]\.gnupg\b'
        - '(Google/Chrome|Chromium|BraveSoftware|Microsoft/Edge|Firefox/Profiles|\.mozilla/firefox)\b'
        - '\b(Login Data|cookies\.sqlite|key4\.db|logins\.json)\b'
        - '\b(security\s+(find-generic-password|find-internet-password|dump-keychain)|login\.keychain|Library/Keychains)\b'
        - '[''"`/~]\.(claude|cursor|codeium|continue|windsurf)(/|[''"`])'
        - '\bclaude_desktop_config\.json\b|[''"`/]\.claude\.json\b'
