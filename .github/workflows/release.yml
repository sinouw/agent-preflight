name: Release

# Push a tag like v0.2.0 (matching package.json) to publish to npm and create the GitHub
# release. Publishing uses npm trusted publishing (OIDC): no npm token is stored in this
# repository, and npm attaches a provenance statement to every published version.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11

      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci

      # prepublishOnly runs lint, typecheck, tests and the build.
      - name: Publish to npm
        run: |
          name="$(node -p 'require("./package.json").name')"
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION is already on npm, skipping publish."
          else
            npm publish
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists, skipping."
            exit 0
          fi
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            /^## \[/ { if (f) exit }
            /^\[.*\]: / { next }
            f
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "agent-preflight $GITHUB_REF_NAME" --notes-file notes.md
