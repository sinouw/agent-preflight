name: Bug report
description: The CLI crashed, mis-parsed a file or produced invalid output.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `preflight --version`.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: preflight scan ./my-server --format sarif
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A small file or snippet that triggers the problem. Remove any secrets.
